<p-drawer [(visible)]="lsidebar" position="right" [style]="{width:'450px', 'max-width':'100%'}" [modal]="false">
        <p-button (click)="isAddServiceVisible=true" icon="pi pi-plus" i18n-label label="Add map service"></p-button>
        <div>
            <ng-template layersHost></ng-template>
        </div>
        <hr>
        <h2 i18n>Base layers</h2>
        <div class="flex gap-3">
            <p-radioButton inputId="bgOSM" name="backgroundLayers" value="osm" [(ngModel)]="backgroundLayer"></p-radioButton>
            <label for="bgOSM">Open Street Map</label>
        </div>
        <div class="flex gap-3 align-items-baseline mt-2">
            <p-radioButton inputId="bgBing" name="backgroundLayers" value="bing" [(ngModel)]="backgroundLayer" [disabled]="!isAzureLayerEnabled"></p-radioButton>
            <label for="bgBing" [class.text-400]="!isAzureLayerEnabled">Azure Maps</label>
          <p-button icon="pi pi-ellipsis-h" (click)="isAzureMapPropertiesVisible=true" [style]="{marginLeft:'10px',width:'25px',height:'25px'}"/>
        </div>

</p-drawer>
<app-addservice [(visible)]="isAddServiceVisible" (addService)="onAddService($event)"></app-addservice>
<app-wfslayerproperties [(visible)]="isWfsPropertiesVisible" [layer]="wfsPropertiesLayer"></app-wfslayerproperties>
<app-azuremapproperties [(visible)]="isAzureMapPropertiesVisible" (propertiesChanged)="onAzureMapPropertiesChanged($event)"></app-azuremapproperties>
<div style="position: absolute; top: 40px; right: 10px">
    <p-button (click)="lsidebar = !lsidebar" icon="pi pi-cog" ></p-button>
</div>
<div class="maptools">
    <div>
      <p-button
        icon="pi pi-info"
        [disabled]="infoButtonDisabled"
        [severity]="infoButtonChecked ? 'primary' : 'secondary'"
        (onClick)="onInfoButtonChange()">
      </p-button>
        <span i18n>Info<br>(GetFeatureInfo)</span>
    </div>
    <div>
        <p-button icon="pi pi-flag" (onClick)="onLocationClick()"/>
        <span i18n>Zoom to current<br>position</span>
    </div>
</div>

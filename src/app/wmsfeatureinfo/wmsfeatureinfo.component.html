<p-tabs value="{{ gfis.length > 0 ? gfis[0].title : '' }}">
    <p-tablist>
        @for (tab of gfis; track tab.title) {
            <p-tab [value]="tab.title">{{ tab.title }}</p-tab>
        }
    </p-tablist>
    <p-tabpanels [style]="{'background':'lightgray'}">
        @for (tab of gfis; track tab.html) {
            <p-tabpanel [value]="tab.title" class="flex-column">
              <a [href]="tab.url" [target]="tab.title" class="font-bold" i18n>Open info in new window</a>
              <div class="getFeatureInfoHtml" [innerHTML]="tab.html"></div>
            </p-tabpanel>
        }
    </p-tabpanels>
</p-tabs>
